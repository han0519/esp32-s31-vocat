devices:
  # LCD Power Control (before LCD init). GPIO9 → Q100 ME6211C → LCD_3V3.
  - name: lcd_power
    type: power_ctrl
    sub_type: gpio
    peripherals:
    - name: gpio_power_lcd
      active_level: 0                      # PMOS Q100 gate LOW = ON (v014 proven; EDA/GPIO9 must be LOW to power LCD_3V3)

  # LCD Backlight (PWM)
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 80                  # 80% brightness at boot
    peripherals:
      - name: ledc_backlight

  # Audio Codec Power Control (U2 HE9073A33M5R → ES8389). CE is active-HIGH,
  # so the power_ctrl device must assert GPIO17 HIGH to turn CODEC_3V3 on.
  - name: audio_power
    type: power_ctrl
    sub_type: gpio
    peripherals:
    - name: gpio_codec_power
      active_level: 1                      # Active-HIGH

  # ES8389 Audio DAC
  - name: audio_dac
    chip: es8389
    type: audio_codec
    version: default
    power_ctrl_device: audio_power
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 2
      dac_channel_mask: "11"
      mclk_enabled: false                  # MCLK-less mode on 喵伴
    peripherals:
      # PA (NS4150B CTRL = GPIO2) is driven directly by the application
      # (app_pa_enable) to avoid the double-drive conflict that left the PA
      # muted. Do NOT add a gpio_pa_control peripheral here.
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x20
        frequency: 100000

  # ES8389 Audio ADC (mic capture into Opus/uplink)
  - name: audio_adc
    chip: es8389
    type: audio_codec
    version: default
    power_ctrl_device: audio_power
    config:
      adc_enabled: true
      adc_max_channel: 2
      adc_channel_mask: "11"
      adc_channel_labels: ['FL', 'FR']
      adc_init_gain: 0
      mclk_enabled: false
    peripherals:
      - name: i2s_audio_in
      - name: i2c_master
        address: 0x20
        frequency: 100000

  # ST77916 QSPI 360x360 Round LCD
  - name: display_lcd
    chip: st77916
    type: display_lcd
    sub_type: spi
    power_ctrl_device: lcd_power
    version: default
    dependencies:
      espressif/esp_lcd_st77916: "*"
    config:
      x_max: 360
      y_max: 360
      need_reset: true                   # QSPI ST77916 needs a hardware reset pulse (proven working waveshare 1.85" config)
      io_spi_config:
        cs_gpio_num: 43                   # LCD_CS  (EDA FPC pin11 = GPIO43)
        dc_gpio_num: 40                   # LCD_DC (schematic OHHWHub: GPIO40)
        spi_mode: 0
        lcd_cmd_bits: 32
        flags:
          quad_mode: true
      lcd_panel_config:
        reset_gpio_num: 60                # LCD_RST
        flags:
          reset_active_high: false        # 喵伴: LCD_RST is active-LOW (fixed for correct power-on)
        vendor_config: NULL
    peripherals:
    - name: spi_display

  # CST816S Capacitive Touch (I2C)
  - name: lcd_touch
    chip: cst816s
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_cst816s: "*"
    config:
      touch_config:
        x_max: 360
        y_max: 360
        int_gpio_num: 42                  # TP_INT
    peripherals:
      - name: i2c_master
        i2c_addr: [0x2A]

  # Status LED (Green) — disabled on 喵伴 (no on-board LED)
  - name: led_green
    type: gpio_ctrl
    version: default
    config:
      active_level: 0
      default_level: 1
    peripherals:
      - name: gpio_led_g
    depends_on: false
